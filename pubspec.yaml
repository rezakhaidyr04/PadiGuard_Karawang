name: karawang_agrobrain
description: AI Smart Farming Asisten Berbasis Smartphone untuk Kabupaten Karawang
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Backend API
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Networking & API
  dio: ^5.3.1

  # UI/UX
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # Utilities
  logger: ^2.0.1

  # Image handling
  image: ^4.1.0
  image_picker: ^1.0.7

  # URL Launcher (for WhatsApp integration)
  url_launcher: ^6.2.4

  # Local storage (for chatbot persistence)
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.7+1
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
